params:
  # description: Modern, responsive, batteries-included Hugo theme for creating beautiful static websites.
  theme:
  # set light / dark / system
    default: system
    displayToggle: true
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo-150-light.svg
      dark: images/logo-150-dark.svg
      # width: 40
      # height: 20
      # link: /
    width: wide

  footer:
    displayCopyright: true
    displayPoweredBy: false
    width: wide

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true


